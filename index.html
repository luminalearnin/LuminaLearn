<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VANCURA GENÈVE — The Genesis Collection</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0a0a0d">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Vancura Genève">
<meta name="mobile-web-app-capable" content="yes">
<meta name="description" content="Swiss-inspired timepieces and horlogerie. Reserve a piece from the Genesis Collection — launch pricing, limited to the first order run.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700;800&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0d1119;
    --bg-raised: #141a25;
    --bg-card: #171e2a;
    --hairline: rgba(184,131,106,0.2);
    --gold: #b8836a;
    --gold-light: #d9ab93;
    --gold-dim: #8a5c48;
    --ivory: #f3efe6;
    --ivory-dim: #a8a6a1;
    --ivory-faint: #6c6a68;
    --danger: #a85447;
  }

  *{ margin:0; padding:0; box-sizing:border-box; }

  html{ scroll-behavior: smooth; }

  body{
    background: var(--bg);
    color: var(--ivory);
    font-family: 'Montserrat', sans-serif;
    font-weight: 400;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  h1,h2,h3,.serif{
    font-family: 'Cinzel', serif;
    letter-spacing: 0.02em;
  }

  a{ color: inherit; text-decoration: none; }

  img{ display:block; max-width:100%; }

  .eyebrow{
    font-family:'Montserrat',sans-serif;
    font-size: 11px;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: var(--gold);
    font-weight: 600;
  }

  /* ===== focus visibility ===== */
  a:focus-visible, button:focus-visible, input:focus-visible{
    outline: 1px solid var(--gold);
    outline-offset: 3px;
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.001ms !important; scroll-behavior:auto !important; }
  }

  /* ================= NAV ================= */
  .nav{
    position: fixed;
    top:0; left:0; right:0;
    z-index: 100;
    display:flex;
    align-items:center;
    justify-content: space-between;
    padding: 22px 5vw;
    background: linear-gradient(180deg, rgba(10,10,13,0.9), rgba(10,10,13,0));
    transition: background 0.4s ease, padding 0.4s ease, border-color .4s ease;
    border-bottom: 1px solid transparent;
  }
  .nav.scrolled{
    background: rgba(10,10,13,0.92);
    backdrop-filter: blur(10px);
    padding: 14px 5vw;
    border-bottom: 1px solid var(--hairline);
  }
  .nav-mark{
    font-family:'Cinzel', serif;
    font-size: 17px;
    letter-spacing: 0.18em;
    font-weight: 600;
    color: var(--ivory);
  }
  .nav-mark span{ color: var(--gold); }
  .brand-logo{ height: 30px; width:auto; display:block; }
  .footer-logo{ height: 46px; width:auto; display:block; margin: 0 auto 14px; }
  .nav-links{ display:flex; gap: 40px; }
  .nav-links a{
    font-size: 11px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--ivory-dim);
    font-weight: 500;
    position:relative;
    padding-bottom: 4px;
    transition: color .3s ease;
  }
  .nav-links a:hover{ color: var(--gold-light); }
  .nav-links a::after{
    content:'';
    position:absolute; left:0; bottom:0; height:1px; width:0;
    background: var(--gold);
    transition: width .35s ease;
  }
  .nav-links a:hover::after{ width:100%; }
  .nav-cta{
    border: 1px solid var(--gold-dim);
    padding: 9px 20px;
    font-size: 10.5px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    font-weight: 600;
    color: var(--gold-light);
    transition: all .35s ease;
  }
  .nav-cta:hover{ background: var(--gold); color:#0a0a0d; border-color: var(--gold); }
  .nav-burger{ display:none; }

  /* ================= HERO ================= */
  .hero{
    position: relative;
    min-height: 100svh;
    display:flex;
    flex-direction: column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding: 140px 6vw 100px;
    overflow:hidden;
    background:
      radial-gradient(ellipse 70% 55% at 50% 32%, rgba(198,161,91,0.09), transparent 65%),
      radial-gradient(ellipse 90% 60% at 50% 100%, rgba(198,161,91,0.05), transparent 60%),
      var(--bg);
  }

  /* bezel ring motif */
  .bezel{
    position:absolute;
    top:50%; left:50%;
    width: min(920px, 130vw);
    height: min(920px, 130vw);
    transform: translate(-50%,-50%);
    border-radius:50%;
    border: 1px solid rgba(198,161,91,0.12);
    pointer-events:none;
  }
  .bezel.b2{ width: min(1180px, 160vw); height: min(1180px, 160vw); border-color: rgba(198,161,91,0.07); }
  .bezel-ticks{
    position:absolute; inset:0;
    animation: rotate-slow 140s linear infinite;
  }
  .bezel-ticks i{
    position:absolute;
    top:50%; left:50%;
    width:1px; height: 10px;
    background: rgba(198,161,91,0.35);
    transform-origin: 50% 460px;
  }
  @media (max-width: 640px){
    .bezel-ticks i{ transform-origin: 50% 44vw; }
  }
  .hand{
    position:absolute;
    top:50%; left:50%;
    width: 1px;
    height: min(300px, 42vw);
    background: linear-gradient(180deg, var(--gold) 0%, rgba(198,161,91,0) 100%);
    transform-origin: 50% 100%;
    transform: translate(-50%,-100%) rotate(0deg);
    animation: sweep 60s linear infinite;
    opacity: 0.5;
  }

  @keyframes rotate-slow{ to{ transform: rotate(360deg); } }
  @keyframes sweep{ to{ transform: translate(-50%,-100%) rotate(360deg); } }

  .hero-content{ position:relative; z-index:2; max-width: 900px; }

  .hero-eyebrow{
    display:inline-flex;
    align-items:center;
    gap: 14px;
    margin-bottom: 28px;
    animation: rise 1s ease both;
  }
  .hero-eyebrow .line{ width:34px; height:1px; background: var(--gold-dim); }

  .hero h1{
    font-size: clamp(2.6rem, 7vw, 5.6rem);
    font-weight: 600;
    line-height: 1.05;
    color: var(--ivory);
    animation: rise 1.1s .1s ease both;
  }
  .hero h1 em{ font-style: normal; color: var(--gold-light); }

  .hero-sub{
    margin-top: 22px;
    font-size: clamp(13px, 1.4vw, 15px);
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ivory-dim);
    font-weight: 400;
    animation: rise 1.1s .2s ease both;
  }

  .hero-divider{
    margin: 40px auto;
    display:flex; align-items:center; justify-content:center; gap: 16px;
    animation: rise 1.1s .3s ease both;
  }
  .hero-divider .l{ width: 60px; height:1px; background: linear-gradient(90deg, transparent, var(--gold-dim)); }
  .hero-divider .l.r{ background: linear-gradient(90deg, var(--gold-dim), transparent); }
  .hero-divider .dot{ width:5px; height:5px; border-radius:50%; background: var(--gold); }

  .hero-announce{
    font-family:'Cinzel', serif;
    font-size: clamp(1rem, 2vw, 1.2rem);
    letter-spacing: 0.08em;
    color: var(--ivory);
    font-weight: 500;
    animation: rise 1.1s .35s ease both;
  }
  .hero-announce span{ color: var(--gold); }

  .hero-desc{
    max-width: 560px;
    margin: 26px auto 0;
    font-size: 14.5px;
    line-height: 1.85;
    color: var(--ivory-dim);
    font-weight: 300;
    animation: rise 1.1s .4s ease both;
  }

  .hero-actions{
    margin-top: 44px;
    display:flex; gap:18px; justify-content:center; flex-wrap:wrap;
    animation: rise 1.1s .5s ease both;
  }
  .btn-primary{
    background: var(--gold);
    color: #0a0a0d;
    padding: 16px 38px;
    font-size: 11px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    font-weight: 700;
    border:none;
    cursor:pointer;
    transition: transform .35s ease, box-shadow .35s ease, background .35s ease;
    box-shadow: 0 8px 28px -8px rgba(198,161,91,0.5);
  }
  .btn-primary:hover{ background: var(--gold-light); transform: translateY(-2px); box-shadow: 0 14px 34px -8px rgba(198,161,91,0.65); }
  .btn-ghost{
    background: transparent;
    border: 1px solid var(--hairline);
    color: var(--ivory);
    padding: 16px 34px;
    font-size: 11px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    font-weight: 600;
    cursor:pointer;
    transition: border-color .35s ease, color .35s ease;
  }
  .btn-ghost:hover{ border-color: var(--gold); color: var(--gold-light); }

  @keyframes rise{
    from{ opacity:0; transform: translateY(18px); }
    to{ opacity:1; transform: translateY(0); }
  }

  .scroll-cue{
    position:absolute;
    bottom: 34px; left:50%; transform: translateX(-50%);
    display:flex; flex-direction:column; align-items:center; gap:10px;
    color: var(--ivory-faint);
    font-size: 9.5px;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    z-index:2;
  }
  .scroll-cue .stem{
    width:1px; height: 40px;
    background: linear-gradient(180deg, var(--gold-dim), transparent);
    animation: stem-pulse 2.2s ease-in-out infinite;
  }
  @keyframes stem-pulse{
    0%,100%{ opacity: .3; }
    50%{ opacity: 1; }
  }

  /* ================= TICKER STRIP (bezel numerals) ================= */
  .ticker-wrap{
    border-top: 1px solid var(--hairline);
    border-bottom: 1px solid var(--hairline);
    background: var(--bg-raised);
    overflow:hidden;
    padding: 16px 0;
  }
  .ticker{
    display:flex;
    width: max-content;
    gap: 60px;
    animation: ticker-scroll 34s linear infinite;
  }
  .ticker span{
    font-family:'Cinzel', serif;
    font-size: 12px;
    letter-spacing: 0.2em;
    color: var(--gold-dim);
    white-space: nowrap;
  }
  .ticker span.num{ color: var(--ivory-faint); font-family:'Montserrat',sans-serif; letter-spacing:0.1em; }
  @keyframes ticker-scroll{
    from{ transform: translateX(0); }
    to{ transform: translateX(-50%); }
  }

  /* ================= SECTION: RESERVE ================= */
  .section{
    padding: 120px 6vw;
    max-width: 1320px;
    margin: 0 auto;
  }
  .section-head{
    text-align:center;
    max-width: 640px;
    margin: 0 auto 68px;
  }
  .section-head .eyebrow{ justify-content:center; display:flex; gap:14px; align-items:center; margin-bottom:20px; }
  .section-head .eyebrow .line{ width:26px; height:1px; background: var(--gold-dim); }
  .section-head h2{
    font-size: clamp(2rem, 4vw, 2.9rem);
    font-weight: 600;
    color: var(--ivory);
    margin-bottom: 18px;
  }
  .section-head p{
    color: var(--ivory-dim);
    font-size: 14.5px;
    font-weight: 300;
    line-height: 1.8;
  }

  .grid{
    display:grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 30px;
  }
  @media (max-width: 1080px){ .grid{ grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 560px){ .grid{ grid-template-columns: 1fr; } }

  .card{
    background: var(--bg-card);
    border: 1px solid var(--hairline);
    position:relative;
    display:flex;
    flex-direction:column;
    transition: transform .5s cubic-bezier(.2,.8,.25,1), border-color .5s ease, box-shadow .5s ease;
  }
  .card:hover{
    transform: translateY(-8px);
    border-color: rgba(198,161,91,0.5);
    box-shadow: 0 30px 50px -20px rgba(0,0,0,0.6), 0 0 0 1px rgba(198,161,91,0.08);
  }

  .card-badge{
    position:absolute;
    top: 16px; left: 16px;
    z-index: 3;
    background: rgba(10,10,13,0.85);
    border: 1px solid var(--gold-dim);
    color: var(--gold-light);
    font-size: 10px;
    letter-spacing: 0.12em;
    font-weight: 700;
    padding: 6px 10px;
    text-transform: uppercase;
  }

  .card-media{
    position: relative;
    background: radial-gradient(ellipse at 50% 40%, #1c1c22, #0e0e12 75%);
    aspect-ratio: 1 / 1;
    overflow:hidden;
    display:flex; align-items:center; justify-content:center;
    padding: 26px;
  }
  .card-media img{
    width: 100%; height:100%;
    object-fit: contain;
    transition: transform .6s cubic-bezier(.2,.8,.25,1);
    filter: drop-shadow(0 18px 24px rgba(0,0,0,0.55));
  }
  .card:hover .card-media img{ transform: scale(1.07); }

  .card-body{
    padding: 26px 24px 28px;
    display:flex;
    flex-direction:column;
    flex:1;
    border-top: 1px solid var(--hairline);
  }

  .card-eyebrow{
    font-size: 10px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--gold-dim);
    font-weight: 600;
    margin-bottom: 10px;
  }

  .card-title{
    font-family:'Cinzel', serif;
    font-size: 16.5px;
    line-height: 1.4;
    color: var(--ivory);
    font-weight: 600;
    margin-bottom: 6px;
    min-height: 46px;
  }

  .card-tag{
    font-size: 12.5px;
    color: var(--ivory-dim);
    font-weight: 300;
    line-height: 1.6;
    margin-bottom: 20px;
  }

  .price-row{
    display:flex;
    align-items: baseline;
    gap: 12px;
    margin-bottom: 6px;
  }
  .price-now{
    font-family:'Cinzel', serif;
    font-size: 24px;
    color: var(--gold-light);
    font-weight: 700;
  }
  .price-was{
    font-size: 13.5px;
    color: var(--ivory-faint);
    text-decoration: line-through;
    text-decoration-color: rgba(168,84,71,0.6);
  }
  .price-save{
    font-size: 11.5px;
    color: #8fae8a;
    font-weight: 500;
    margin-bottom: 22px;
  }

  .btn-reserve{
    margin-top: auto;
    background: transparent;
    border: 1px solid var(--gold);
    color: var(--gold-light);
    padding: 13px 18px;
    font-size: 10.5px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    font-weight: 700;
    cursor:pointer;
    transition: background .35s ease, color .35s ease, letter-spacing .35s ease;
  }
  .btn-reserve:hover{ background: var(--gold); color:#0a0a0d; letter-spacing: 0.24em; }

  /* ================= FOOTER STRIP / ASSURANCE ================= */
  .assurance{
    border-top: 1px solid var(--hairline);
    border-bottom: 1px solid var(--hairline);
    background: var(--bg-raised);
  }
  .assurance-inner{
    max-width: 1320px;
    margin: 0 auto;
    padding: 56px 6vw;
    display:grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 40px;
  }
  @media (max-width: 780px){ .assurance-inner{ grid-template-columns: 1fr; gap: 34px; } }
  .assurance-item{ text-align:center; }
  .assurance-item .mark{
    font-family:'Cinzel', serif;
    color: var(--gold);
    font-size: 20px;
    margin-bottom: 14px;
    display:block;
  }
  .assurance-item h4{
    font-family:'Cinzel', serif;
    font-size: 14px;
    color: var(--ivory);
    margin-bottom: 10px;
    font-weight: 600;
    letter-spacing: 0.04em;
  }
  .assurance-item p{
    font-size: 12.5px;
    color: var(--ivory-dim);
    font-weight: 300;
    line-height: 1.75;
    max-width: 280px;
    margin: 0 auto;
  }

  /* ================= FOOTER ================= */
  footer{
    padding: 70px 6vw 40px;
    text-align:center;
  }
  .footer-mark{
    font-family:'Cinzel', serif;
    font-size: 22px;
    letter-spacing: 0.2em;
    color: var(--ivory);
    margin-bottom: 14px;
  }
  .footer-mark span{ color: var(--gold); }
  .footer-tag{
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--ivory-faint);
    margin-bottom: 34px;
  }
  .footer-rule{
    width: 60px; height:1px; background: var(--gold-dim);
    margin: 0 auto 30px;
  }
  .footer-copy{
    font-size: 11.5px;
    color: var(--ivory-faint);
    font-weight: 300;
  }

  /* ================= MODAL ================= */
  .modal-overlay{
    position: fixed; inset:0;
    background: rgba(6,6,8,0.78);
    backdrop-filter: blur(6px);
    z-index: 1000;
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 24px;
    opacity:0;
    pointer-events:none;
    transition: opacity .35s ease;
  }
  .modal-overlay.open{ opacity:1; pointer-events:all; }

  .modal{
    background: var(--bg-card);
    border: 1px solid var(--hairline);
    max-width: 460px;
    width:100%;
    padding: 44px 38px 38px;
    position:relative;
    transform: translateY(14px) scale(0.98);
    transition: transform .4s cubic-bezier(.2,.8,.25,1);
    max-height: 90vh;
    overflow-y: auto;
  }
  .modal-overlay.open .modal{ transform: translateY(0) scale(1); }

  .modal-close{
    position:absolute;
    top: 18px; right: 18px;
    width: 30px; height:30px;
    background:transparent;
    border: 1px solid var(--hairline);
    color: var(--ivory-dim);
    font-size: 16px;
    cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    transition: border-color .3s ease, color .3s ease, transform .3s ease;
  }
  .modal-close:hover{ border-color: var(--gold); color: var(--gold-light); transform: rotate(90deg); }

  .modal-eyebrow{
    font-size: 10.5px;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    color: var(--gold);
    font-weight: 700;
    margin-bottom: 10px;
  }
  .modal h3{
    font-family:'Cinzel', serif;
    font-size: 22px;
    color: var(--ivory);
    font-weight: 600;
    line-height: 1.4;
    margin-bottom: 6px;
  }
  .modal-watch-name{
    font-size: 13px;
    color: var(--ivory-dim);
    font-weight: 300;
    margin-bottom: 30px;
    padding-bottom: 24px;
    border-bottom: 1px solid var(--hairline);
  }
  .modal-watch-name strong{ color: var(--gold-light); font-weight: 600; }

  .field{ margin-bottom: 20px; }
  .field label{
    display:block;
    font-size: 10.5px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--ivory-dim);
    font-weight: 600;
    margin-bottom: 10px;
  }
  .field input{
    width:100%;
    background: var(--bg);
    border: 1px solid var(--hairline);
    color: var(--ivory);
    padding: 13px 14px;
    font-family:'Montserrat', sans-serif;
    font-size: 14px;
    font-weight: 400;
    transition: border-color .3s ease;
  }
  .field input::placeholder{ color: var(--ivory-faint); }
  .field input:focus{ outline:none; border-color: var(--gold); }

  .modal-submit{
    width:100%;
    margin-top: 6px;
    background: var(--gold);
    color: #0a0a0d;
    border:none;
    padding: 15px;
    font-size: 11px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    font-weight: 700;
    cursor:pointer;
    transition: background .3s ease;
  }
  .modal-submit:hover{ background: var(--gold-light); }

  .modal-note{
    margin-top: 16px;
    font-size: 11px;
    color: var(--ivory-faint);
    text-align:center;
    line-height: 1.6;
  }

  /* success state */
  .modal-success{ display:none; text-align:center; padding: 20px 0 6px; }
  .modal-success.show{ display:block; }
  .modal-success .check{
    width: 54px; height:54px;
    border: 1px solid var(--gold);
    border-radius: 50%;
    display:flex; align-items:center; justify-content:center;
    margin: 0 auto 22px;
    color: var(--gold);
    font-size: 22px;
  }
  .modal-success h3{ margin-bottom: 12px; }
  .modal-success p{ color: var(--ivory-dim); font-size: 13px; line-height: 1.8; font-weight:300; }
  .modal-form.hide{ display:none; }

  /* mobile nav adjustments */
  @media (max-width: 720px){
    .nav-links{ display:none; }
  }
</style>
</head>
